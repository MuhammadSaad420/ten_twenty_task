name: court_pro
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Always declare dependencies without Cap symbol(^).
  connectivity_plus: 6.0.5
  fluttertoast: 8.2.8
  flutter_localizations:
    sdk: flutter
  intl: 0.19.0
  shared_preferences: 2.2.3
  get_it: 8.0.0
  cached_network_image: 3.4.0
  flutter_hooks: 0.20.5
  svg_flutter: 0.0.1  
  gap: 3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
